# 선택 기능의 상태만 관리한다. 프로젝트 정보는 PROJECT.md, 모델은 models.yaml을 따른다.
# false인 기능은 기본 작업 흐름에서 읽거나 실행하거나 기록할 의무가 없다.
# true로 바꿔도 미구현 기능이 설치되거나 실행되지는 않는다.
starter:
  name: universal-ai-dev-starter
  version: "0.2.8"

features:
  hermes: false
  figma: false
  custom_router: false
  classifier_training: false
  task_history: false
  task_history_optimization: false
  durable_memory: false
  task_capsule: false
  evidence_log: false
  design_pipeline: false
